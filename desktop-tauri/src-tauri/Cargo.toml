[package]
name = "deepconvo-mindmap-tauri"
version = "1.0.1"
description = "BranchMark desktop application"
license = "GPL-3.0-only"
repository = "https://github.com/Zevxn/BranchMark"
edition = "2021"
publish = false

[lib]
name = "deepconvo_mindmap_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "=2.4.0"
tauri-plugin-window-state = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
