        <button class="btn" id="btn-undo" title="Ctrl+Z" disabled><i class="ri-arrow-go-back-line"></i></button>
        <button class="btn" id="btn-redo" title="Ctrl+Y" disabled><i class="ri-arrow-go-forward-line"></i></button>
        <div class="divider"></div>
        <button class="btn" id="btn-add-child" disabled title="新建子卡片"><i class="ri-git-branch-line"></i></button>
        <button class="btn" id="btn-add-sibling" disabled title="新建兄弟卡片"><i class="ri-node-tree"></i></button>
        <button class="btn" id="btn-add-relation" disabled title="关联两张已选卡片"><i class="ri-links-line"></i></button>
        <button class="btn" id="btn-add-summary" disabled title="总结同侧已选卡片"><i class="ri-braces-line"></i></button>
        <button class="btn" id="btn-delete" style="color:#ff4d4f" disabled title="删除卡片"><i class="ri-delete-bin-line"></i></button>
        <div class="divider"></div>
        <button class="btn" id="btn-color" disabled title="设置卡片颜色">
            <i class="ri-palette-line"></i>
        </button>
        <button class="btn" id="btn-rainbow" title="切换彩虹分支模式">
            <i class="ri-rainbow-line"></i>
        </button>
        <button class="btn" id="btn-search" type="button" title="搜索定位 (Ctrl+F)" aria-label="搜索定位">
            <i class="ri-search-line"></i>
        </button>
        <button class="btn" id="btn-center"><i class="ri-focus-3-line" title="中心归位"></i></button>
        <button class="btn" id="btn-compact-view" type="button" title="开启精简视图，仅本次运行有效" aria-label="切换精简视图" aria-pressed="false">
            <i class="ri-menu-fold-line"></i>
        </button>
        <div class="divider"></div>
        <button class="btn" id="btn-new"><i class="ri-file-add-line" title="新建脑图"></i></button>
        <button class="btn" id="btn-save"><i class="ri-save-3-fill" title="保存脑图"></i></button>
        <button class="btn" id="btn-open"><i class="ri-download-2-fill" title="导入脑图"></i></button>
        <button class="btn" id="btn-export"><i class="ri-upload-2-fill" title="导出脑图"></i></button>
        <div class="divider"></div>
        <button class="btn" id="btn-export-canvas" title="导出为 Obsidian Canvas">
            <i class="ri-artboard-line"></i>
        </button>
        <button class="btn" id="btn-export-vertical" title="导出为 竖向 Canvas">
            <i class="ri-node-tree" style="transform: rotate(90deg);"></i>
        </button>
        <button class="btn" id="btn-change-folder" title="切换保存目录">
            <i class="ri-folder-settings-line"></i>
        </button>
        <div class="divider"></div>
        <button class="btn" id="btn-theme-toggle" type="button" title="切换到暗色模式" aria-label="切换亮暗模式">
            <i class="ri-moon-line"></i>
        </button>
    </div>

    <section class="map-search-panel" id="mapSearchPanel" role="dialog" aria-label="搜索卡片" aria-hidden="true">
        <div class="map-search-bar">
            <i class="ri-search-line" aria-hidden="true"></i>
            <input class="map-search-input" id="mapSearchInput" type="search" placeholder="搜索标题或正文" autocomplete="off" spellcheck="false">
            <span class="map-search-count" id="mapSearchCount" aria-live="polite">0/0</span>
            <button class="map-search-action" id="btn-search-visible" type="button" title="仅搜索未折叠卡片" aria-label="仅搜索未折叠卡片" aria-pressed="false"><i class="ri-eye-line"></i></button>
            <button class="map-search-action" id="btn-search-prev" type="button" title="上一个 (Shift+Enter)" aria-label="上一个结果" disabled><i class="ri-arrow-up-s-line"></i></button>
            <button class="map-search-action" id="btn-search-next" type="button" title="下一个 (Enter)" aria-label="下一个结果" disabled><i class="ri-arrow-down-s-line"></i></button>
            <button class="map-search-action" id="btn-search-close" type="button" title="关闭 (Esc)" aria-label="关闭搜索"><i class="ri-close-line"></i></button>
        </div>
        <div class="map-search-results" id="mapSearchResults" role="listbox" aria-label="搜索结果">
            <div class="map-search-empty">输入关键词，搜索卡片标题和正文</div>
        </div>
    </section>

    <section class="relation-editor" id="relationEditor" role="dialog" aria-label="编辑卡片关联" aria-hidden="true">
        <div class="relation-editor-head">
            <i class="ri-links-line" aria-hidden="true"></i>
            <span class="relation-editor-title" id="relationEditorTitle">编辑关联</span>
            <button class="relation-editor-close" id="btn-relation-editor-close" type="button" title="关闭" aria-label="关闭关联编辑器"><i class="ri-close-line"></i></button>
        </div>
        <label class="relation-editor-field">
            <span class="relation-editor-label">标签</span>
            <input class="relation-label-input" id="relationLabelInput" type="text" maxlength="80" placeholder="可选，例如：依赖于" autocomplete="off" spellcheck="false">
        </label>
        <div class="relation-editor-field">
            <span class="relation-editor-label">方向</span>
            <div class="relation-editor-row" role="group" aria-label="关联方向">
                <button class="relation-choice" type="button" data-relation-direction="none">无向</button>
                <button class="relation-choice" type="button" data-relation-direction="forward">A → B</button>
                <button class="relation-choice" type="button" data-relation-direction="reverse">B → A</button>
            </div>
        </div>
        <div class="relation-editor-field">
            <span class="relation-editor-label">线型</span>
            <div class="relation-editor-row" role="group" aria-label="关联线型">
                <button class="relation-choice" type="button" data-relation-style="dashed">虚线</button>
                <button class="relation-choice" type="button" data-relation-style="solid">实线</button>
            </div>
        </div>
        <div class="relation-editor-field">
            <span class="relation-editor-label">颜色</span>
            <div class="relation-editor-colors" role="group" aria-label="关联颜色">
                <button class="relation-color-choice" type="button" data-relation-color="" title="跟随主题" aria-label="跟随主题"></button>
                <button class="relation-color-choice" type="button" data-relation-color="#e5484d" style="background:#e5484d" title="红色" aria-label="红色"></button>
                <button class="relation-color-choice" type="button" data-relation-color="#f59f00" style="background:#f59f00" title="橙色" aria-label="橙色"></button>
                <button class="relation-color-choice" type="button" data-relation-color="#2f9e44" style="background:#2f9e44" title="绿色" aria-label="绿色"></button>
                <button class="relation-color-choice" type="button" data-relation-color="#1971c2" style="background:#1971c2" title="蓝色" aria-label="蓝色"></button>
                <button class="relation-color-choice" type="button" data-relation-color="#7950f2" style="background:#7950f2" title="紫色" aria-label="紫色"></button>
                <input class="relation-custom-color" id="relationCustomColor" type="color" value="#1971c2" title="自定义颜色" aria-label="自定义关联颜色">
            </div>
        </div>
        <button class="relation-editor-delete" id="btn-delete-relation" type="button"><i class="ri-delete-bin-line"></i> 删除关联</button>
    </section>

    <section class="relation-navigation-menu" id="relationNavigationMenu" role="dialog" aria-label="关联卡片" aria-hidden="true">
        <div class="relation-navigation-head">
            <i class="ri-links-line" aria-hidden="true"></i>
            <span>关联卡片</span>
            <span class="relation-navigation-count" id="relationNavigationCount">0</span>
            <button class="map-search-action relation-navigation-close" id="btn-relation-navigation-close" type="button" title="关闭" aria-label="关闭关联卡片列表"><i class="ri-close-line"></i></button>
        </div>
        <div class="relation-navigation-list" id="relationNavigationList" role="menu" aria-label="可跳转的关联卡片"></div>
    </section>

    <div class="color-popup" id="colorPopup">
        <div class="color-swatch" style="background:#ffffff" data-color=""></div>
        <div class="color-swatch" style="background:#ffecb3" data-color="#ffecb3"></div>
        <div class="color-swatch" style="background:#ffcdd2" data-color="#ffcdd2"></div>
        <div class="color-swatch" style="background:#e1bee7" data-color="#e1bee7"></div>
        <div class="color-swatch" style="background:#bbdefb" data-color="#bbdefb"></div>
        <div class="color-swatch" style="background:#c8e6c9" data-color="#c8e6c9"></div>
        <div class="color-swatch" style="background:#ffbf5e" data-color="#ffbf5e"></div>
        <div class="color-swatch" style="background:#74cbdd" data-color="#74cbdd"></div>
        <div style="grid-column: 1 / -1; height:1px; background:var(--toolbar-border); margin:4px 0; opacity:0.5;"></div>
        <div class="custom-color-btn" title="自定义颜色...">
            <i class="ri-palette-line"></i> 自定义
            <input type="color" id="toolbarCustomColor">
        </div>
    </div>

    <div class="card-dock-container" id="dock-container">
        <div class="dock-handle" id="dock-handle">
            <i class="ri-arrow-down-s-line" id="dock-arrow"></i>
        </div>
        <div class="card-dock-body" id="dock-body"></div>
    </div>


    <div id="app">
        <div class="canvas-layer" id="canvas-layer">
            <svg class="relation-layer" id="relation-layer" aria-label="卡片关联线"></svg>
            <svg class="summary-brace-layer" id="summary-brace-layer" aria-label="多卡片总结大括号"></svg>
            <div class="root-locator" id="tree-root"></div>
            <div class="summary-label-layer" id="summary-label-layer"></div>
        </div>
        <button class="summary-selection-action" id="summarySelectionAction" type="button">
            <i class="ri-braces-line"></i><span>添加总结</span>
        </button>
        <!-- 框选功能”（Marquee Selection / Box Selection）时的那个蓝色半透明矩形框 -->
        <div class="selection-rect" id="selRect"></div>
        <div class="insert-line" id="insertLine"></div>
        <div class="ghost-node" id="ghostNode">
            <i id="ghostIcon" class="ri-drag-move-line"></i>
            <span id="ghostTitle">Title</span>
            <span id="ghostCount" class="ghost-count" style="display:none;"></span>
        </div>
    </div>

    <div class="node-stats" id="nodeStats" aria-live="polite" title="子节点为直接子节点；兄弟节点不包含当前卡片">
        <span>节点 <span class="node-stats-value" id="nodeStatsTotal">0</span></span>
        <span class="node-stats-divider">·</span>
        <span>子 <span class="node-stats-value" id="nodeStatsChildren">—</span></span>
        <span class="node-stats-divider">·</span>
        <span>兄弟 <span class="node-stats-value" id="nodeStatsSiblings">—</span></span>
    </div>


    <!-- 右键菜单 -->
    <div id="contextMenu" class="context-menu">
        <div class="menu-item" data-action="copy-md">
            <i class="ri-markdown-fill"></i> 复制md
        </div>
        <div class="menu-item" data-action="cut">
            <i class="ri-scissors-cut-line"></i> 剪切节点
        </div>
        <div class="menu-item" data-action="copy">
            <i class="ri-file-copy-line"></i> 复制节点
        </div>
        <div class="menu-item" data-action="paste">
            <i class="ri-clipboard-line"></i> 粘贴节点
        </div>
        <div class="menu-item" data-action="delete" style="color:#ff4d4f" >
            <i class="ri-delete-bin-line"  style="color:#ff4d4f"></i> 删除节点
        </div>
        <div class="menu-divider"></div>

        <div class="menu-item" data-action="expand">
            <i class="ri-arrow-down-s-line"></i> 展开内容
        </div>
        <div class="menu-item" data-action="collapse">
            <i class="ri-arrow-right-s-line"></i> 折叠内容
        </div>
        <div class="menu-item" data-action="to-standard">
            <i class="ri-layout-top-2-line"></i> 转为标准卡片
        </div>
        <div class="menu-item" data-action="to-simple">
            <i class="ri-sticky-note-line"></i> 转为便利贴
        </div>
        <div class="menu-item" data-action="auto-fit">
            <i class="ri-aspect-ratio-line"></i> 自适应尺寸
        </div>
        <div class="menu-divider"></div>
        <!-- 颜色子菜单 -->
        <div class="menu-item has-submenu">
            <i class="ri-palette-line"></i> 设置颜色
            <i class="ri-arrow-right-s-line submenu-arrow"></i>
            <div class="submenu">
                <div class="color-grid-title">预设颜色</div>
                <div class="editor-color-grid">
                    <!-- 注意：为了统一逻辑，这里 data-val 存的是背景色 -->
                    <!-- 复用 editor-swatch 类名以保证大小一致 -->
                    <div class="color-swatch" style="background:#ffffff" data-color=""></div>
                    <div class="color-swatch" style="background:#ffecb3" data-color="#ffecb3"></div>
                    <div class="color-swatch" style="background:#ffcdd2" data-color="#ffcdd2"></div>
                    <div class="color-swatch" style="background:#e1bee7" data-color="#e1bee7"></div>
                    <div class="color-swatch" style="background:#bbdefb" data-color="#bbdefb"></div>
                    <div class="color-swatch" style="background:#c8e6c9" data-color="#c8e6c9"></div>
                    <div class="color-swatch" style="background:#ffbf5e" data-color="#ffbf5e"></div>
                    <div class="color-swatch" style="background:#74cbdd" data-color="#74cbdd"></div>
                </div>
                
                <div class="menu-divider-h"></div>
                
                <!-- 复用 custom-color-btn 类名 -->
                <div class="custom-color-btn">
                    <i class="ri-palette-line"></i> 自定义...
                    <input type="color" id="ctxCustomColor">
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑器专属右键菜单 -->
    <div id="editorContextMenu" class="context-menu" style="z-index: 3005;">
        <!-- 剪贴板 -->
        <div class="menu-item" data-cmd="cut"><i class="ri-scissors-cut-line"></i> 剪切</div>
        <div class="menu-item" data-cmd="copy"><i class="ri-file-copy-line"></i> 复制</div>
        <div class="menu-item" data-cmd="paste"><i class="ri-clipboard-line"></i> 粘贴</div>
        <div class="menu-divider"></div>

        <!-- 格式化 -->
        <div class="menu-item" data-cmd="bold"><i class="ri-bold"></i> 加粗</div>
        <div class="menu-item" data-cmd="italic"><i class="ri-italic"></i> 斜体</div>
        <div class="menu-item" data-cmd="highlight"><i class="ri-mark-pen-line"></i> 高亮</div>
        <div class="menu-divider"></div>
        
        <!-- 颜色子菜单 -->
        <div class="menu-item has-submenu">
            <i class="ri-palette-line"></i> 文字颜色
            <i class="ri-arrow-right-s-line submenu-arrow"></i>
            <div class="submenu">
                <div class="color-grid-title">预设颜色</div>
                <div class="editor-color-grid">
                    <!-- 预设色块 -->
                    <div class="editor-swatch" style="background:#ff4d4f" data-val="#ff4d4f"></div>
                    <div class="editor-swatch" style="background:#ffec3d" data-val="#ffec3d"></div>
                    <div class="editor-swatch" style="background:#52c41a" data-val="#52c41a"></div>
                    <div class="editor-swatch" style="background:#1890ff" data-val="#1890ff"></div>
                    <div class="editor-swatch" style="background:#722ed1" data-val="#722ed1"></div>
                    <div class="editor-swatch" style="background:#f5222d" data-val="#f5222d"></div>
                    <div class="editor-swatch" style="background:#262626" data-val="#262626"></div>
                    <div class="editor-swatch" style="background:#8c8c8c" data-val="#8c8c8c"></div>
                </div>
                
                <div class="menu-divider-h"></div>
                
                <!-- 自定义颜色按钮 -->
                <div class="custom-color-btn">
                    <i class="ri-palette-line"></i> 自定义...
                    <input type="color" id="editorCtxCustomColor">
                </div>
            </div>
        </div>
    </div>
    <div class="modal-mask" id="editorModal">
        <div class="modal-win" id="modalWin">
            <div class="modal-head">
                <textarea id="modalTopicInput" rows="1" spellcheck="false"></textarea>
                <div style="display:flex; gap:10px;">
                    <button class="btn" id="btn-fullscreen"><i id="icon-fullscreen" class="ri-fullscreen-line"></i></button>
                    <button class="btn primary" id="btn-close-modal" title="完成并退出编辑 (Esc)">完成</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="editor-pane">
                    <!-- 新增：编辑器工具栏 -->
                    <!-- 原有的 .editor-toolbar 内部 -->
                    <div class="editor-toolbar">
                        <button class="icon-btn edit-btn" id="btn-copy-md" title="复制 Markdown 源码">
                            <i class="ri-file-copy-2-line"></i>
                        </button>
                        <button class="edit-btn" data-cmd="bold" title="加粗 (Ctrl+B)"><i class="ri-bold"></i></button>
                        <button class="edit-btn" data-cmd="italic" title="斜体 (Ctrl+I)"><i class="ri-italic"></i></button>
                        <div class="divider"></div>

                        <!-- ▼▼▼ 修改开始：新的颜色下拉菜单结构 ▼▼▼ -->
                        <div class="color-dropdown-wrapper">
                            <!-- 触发按钮 -->
                            <button class="edit-btn" id="btn-toggle-color" title="文字颜色">
                                <i class="ri-font-color"></i>
                                <i class="ri-arrow-down-s-fill" style="font-size: 10px; margin-left: 2px;"></i>
                            </button>
                            
                            <!-- 下拉面板 (默认隐藏) -->
                            <div class="color-menu" id="editorColorMenu">
                                <div class="color-grid-title">预设颜色</div>
                                <div class="editor-color-grid">
                                    <!-- 常用颜色预设 -->
                                    <div class="editor-swatch" style="background:#ff4d4f" data-val="#ff4d4f" title="红色"></div>
                                    <div class="editor-swatch" style="background:#ffec3d" data-val="#ffec3d" title="黄色"></div>
                                    <div class="editor-swatch" style="background:#52c41a" data-val="#52c41a" title="绿色"></div>
                                    <div class="editor-swatch" style="background:#1890ff" data-val="#1890ff" title="蓝色"></div>
                                    <div class="editor-swatch" style="background:#722ed1" data-val="#722ed1" title="紫色"></div>
                                    <div class="editor-swatch" style="background:#f5222d" data-val="#f5222d" title="玫红"></div>
                                    <div class="editor-swatch" style="background:#262626" data-val="#262626" title="黑色"></div>
                                    <div class="editor-swatch" style="background:#8c8c8c" data-val="#8c8c8c" title="灰色"></div>
                                </div>
                                
                                <div class="menu-divider-h"></div>
                                
                                <!-- 自定义颜色入口 -->
                                <div class="custom-color-btn">
                                    <i class="ri-palette-line"></i> 自定义...
                                    <!-- 原生取色器透明覆盖在上面 -->
                                    <input type="color" id="editorCustomColor">
                                </div>
                            </div>
                        </div>
                        <!-- ▲▲▲ 修改结束 ▲▲▲ -->

                        <button class="edit-btn" data-cmd="highlight" title="文字高亮"><i class="ri-mark-pen-line"></i></button>
                        <div class="divider"></div>
                        <button class="edit-btn" id="btn-img-settings" title="配置图床 (ImgBB)"><i class="ri-image-fill"></i></button>
                    </div>
                    <textarea class="editor" id="editorTextarea" placeholder="在此输入 Markdown..."></textarea>
                </div>
                <div class="preview-pane">
                    <div class="preview-content md-content" id="previewContent" style="font-size: 16px; line-height: 1.6;"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
