}.answer-area{background:var(--card-bg);border-radius:12px;padding:24px;border:1px solid var(--toolbar-border);position:relative;width:100%;box-shadow:0 2px 12px var(--shadow-color)}.answer-number{position:absolute;left:-12px;top:20px;width:28px;height:28px;border-radius:50%;background:var(--accent-answer);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.8rem;border:2px solid var(--card-bg);box-shadow:0 2px 8px rgba(16,185,129,.3);user-select:none}.answer-number:hover{transform:scale(1.1);cursor:pointer}.md-content{line-height:1.7;font-size:1rem;color:var(--text-color);margin-left:20px;transition:max-height .8s ease;overflow:hidden}.answer-area.collapsed .md-content{max-height:80px;position:relative}.gradient-mask{position:absolute;bottom:0;left:20px;right:20px;height:100px;background:linear-gradient(to top,var(--gradient-start) 0,var(--gradient-start) 25%,var(--gradient-mid) 50%,var(--gradient-end) 100%);pointer-events:none;opacity:0;transition:opacity .3s ease}.answer-area.collapsed .gradient-mask{opacity:1}.read-more-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:4px 12px;border-radius:15px;font-size:12px;opacity:0;cursor:pointer;user-select:none;transition:opacity .3s ease}.answer-area.collapsed .read-more-hint{opacity:1}@media (max-width:768px){.markdown-container{padding:20px;border-radius:12px}.answer-area,.question-area{padding:16px 20px}.answer-number,.question-number{width:24px;height:24px;font-size:.7rem;left:-10px}.md-content,.question-text{margin-left:16px}.md-content td,.md-content th{padding:10px 12px;font-size:.9rem}}.loading{text-align:center;padding:40px;color:var(--text-color-secondary);font-size:1rem}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--scrollbar-track);border-radius:4px}::-webkit-scrollbar-thumb{background-color:var(--scrollbar-thumb);border-radius:4px}::-webkit-scrollbar-thumb:hover{back
