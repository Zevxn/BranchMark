<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI对话记录</title>
    
    <!-- 依赖库 -->
    <link href="../libs/katex.min.css" rel="stylesheet">
    <link href="../libs/atom-one-light.min.css" rel="stylesheet">
    <link href="../libs/remixicon.css" rel="stylesheet">

    <script src="../libs/mermaid.min.js"></script>
    <script src="../libs/marked.min.js"></script>
    <script src="../libs/katex.min.js"></script>
    <script src="../libs/auto-render.min.js"></script>
    <script src="../libs/highlight.min.js"></script>
    
    <script src="../JS/static/i18n.js"></script>
    <script src="../libs/turndown.js"></script>
    <script src="../libs/turndown-plugin-gfm.js"></script>
    <script src="../libs/pinyin-pro.js"></script>

    <script src="../JS/renderMD.js" defer></script>
    <script src="../JS/preview-init.js" defer></script>
    <script src="../JS/utils.js" defer></script>
    <script src="../JS/cmdModal.js" defer></script>
    <script src="../JS/common.js" defer></script>
    <script src="../JS/BookMarks.js" defer></script>
    <script src="../JS/AI-Contents.js" defer></script>
    <script src="../JS/handleMD.js" defer></script>
    <link rel="stylesheet" href="../CSS/BookMarks.css">
    <link rel="stylesheet" href="../CSS/AI-Contents.css">
    
    <style>

    /* --- 1. 基础变量 (Light Mode) --- */
    :root { 
        --bg-primary: #f8fafc;
        --card-bg: #ffffff;
        --bg-secondary: #f1f5f9;
        
        --code-block-bg: #f6f8fa; 
        --code-block-border: #d0d7de;
        --code-inline-bg: rgba(175,184,193,0.2);
        
        /* 字体栈 (Atom/MindMap 同款) */
        --code-font-family: ui-monospace, SFMono-Regular, "SF Mono", "Segoe UI Mono", "Roboto Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;

        --toolbar-border: #e2e8f0;
        --text-color: #24292e; 
        --text-color-secondary: #57606a; 
        
        --accent-question: #007bff;
        --accent-answer: #10b981;
        --shadow-color: rgba(0, 0, 0, 0.08);
        
        --scrollbar-track: #f1f5f9;
        --scrollbar-thumb: #c1c7cd;
        
        --gradient-start: rgba(255, 255, 255, 1);
        --gradient-mid: rgba(255, 255, 255, 0.8);
        --gradient-end: rgba(255, 255, 255, 0);
        --btn-hover: #f1f3f5;
        --primary: #007bff; 
    }

    /* --- 2. 暗色模式适配 (Dark Mode) --- */
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg-primary: #1e1e1e;   
            --card-bg: #2d2d2d;      
            --bg-secondary: #383838; 
            
            --code-block-bg: rgba(0, 0, 0, 0.3); 
            --code-block-border: #444;
            --code-inline-bg: rgba(110,118,129,0.4);

            --toolbar-border: #444;    
            --text-color: #e0e0e0;
            --text-color-secondary: #d0d0d0;
            
            --accent-question: #4dabf7; 
            --accent-answer: #3fb950;
            --shadow-color: rgba(0, 0, 0, 0.3);
            
            --scrollbar-track: rgba(255,255,255,0.02);
            --scrollbar-thumb: #4a4a4a;

            --gradient-start: rgba(45, 45, 45, 1);
            --gradient-mid: rgba(45, 45, 45, 0.8);
            --gradient-end: rgba(45, 45, 45, 0);
            --btn-hover: #3d3d3d;
            --primary: #4dabf7; 
        }

    }

    /* --- 优化后的全局重置 --- */
    *, *::before, *::after {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        
        background: var(--bg-primary);
        color: var(--text-color);
        
        transition: background-color 0.3s ease, color 0.3s ease;
    }


    .markdown-container,
    .question-area,
    .answer-area{
        transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    /* --- 布局容器 --- */
    .markdown-container {
        max-width: 1000px; 
        margin: 0 auto;
        background: var(--card-bg); 
        border-radius: 16px;
        box-shadow: 0 4px 20px var(--shadow-color);
        padding: 30px; 
        border: 1px solid var(--toolbar-border);
        line-height: 1.6;

    }




    /* --- 问答区域布局 --- */
    h1#pageTitle { text-align: center; margin-bottom: 40px; color: var(--text-color); font-weight: 600; font-size: 2rem; }
    .dialogue-container { display: flex; flex-direction: column; gap: 30px; }
    .qa-pair { display: flex; flex-direction: column; gap: 16px; }
    
    .question-wrapper {
        position: relative;
        width: 100%;
    }

    .question-area {
        background: var(--bg-secondary); 
        color: var(--text-color);
        border-radius: 12px; padding: 20px 24px; 
        width: 100%; border: 1px solid var(--toolbar-border);
    }
    .question-number {
        position: absolute; left: -12px; top: 16px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-question); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.8rem; border: 2px solid var(--card-bg); box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);z-index: 1000;
    }
    .question-text { font-size: 1.05rem; line-height: 1.6; color: var(--text-color); font-weight: 500; margin-left: 20px; }
    
    .answer-area {
        background: var(--card-bg); 
        border-radius: 12px; padding: 24px; border: 1px solid var(--toolbar-border); position: relative; width: 100%; box-shadow: 0 2px 12px var(--shadow-color);
    }
    .answer-number {
        position: absolute; left: -12px; top: 20px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-answer); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.8rem; border: 2px solid var(--card-bg); box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3); user-select: none;
    }
    .answer-number:hover { transform: scale(1.1); cursor: pointer; }

    /* 内容区域与折叠逻辑 */
    .md-content {
        line-height: 1.7; font-size: 1rem; 
        color: var(--text-color); 
        margin-left: 20px; transition: max-height 0.8s ease; overflow: hidden;
    }
    
    .answer-area.collapsed .md-content { max-height: 80px; position: relative; }
    .gradient-mask {
        position: absolute; bottom: 0; left: 20px; right: 20px; height: 100px; background: linear-gradient(to top, var(--gradient-start) 0%, var(--gradient-start) 25%, var(--gradient-mid) 50%, var(--gradient-end) 100%); pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
    }
    .answer-area.collapsed .gradient-mask { opacity: 1; }
    .read-more-hint {
        position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); color: white; padding: 4px 12px; border-radius: 15px; font-size: 12px; opacity: 0; cursor: pointer; user-select: none; transition: opacity 0.3s ease;
    }
    .answer-area.collapsed .read-more-hint { opacity: 1; }


    /* --- 响应式 & 其他 --- */
    @media (max-width: 768px) {
        .markdown-container { padding: 20px; border-radius: 12px; }
        .question-area, .answer-area { padding: 16px 20px; }
        .question-number, .answer-number { width: 24px; height: 24px; font-size: 0.7rem; left: -10px; }
        .question-text, .md-content { margin-left: 16px; }
        .md-content th, .md-content td { padding: 10px 12px; font-size: 0.9rem; }
    }
    .loading { text-align: center; padding: 40px; color: var(--text-color-secondary); font-size: 1rem; }
    
    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background-color: var(--scrollbar-thumb); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--accent-question); }
    /* --- [新增] 页脚样式 --- */
    .page-footer {
        text-align: center;
        padding-top: 25px; /* 与上方卡片保持距离 */
        padding-bottom: 5px;
        color: var(--text-color-secondary);
        font-size: 0.9rem;
        opacity: 0.8;
    }
    .page-footer a {
        color: var(--accent-question);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
    }
    .page-footer a:hover {
        color: var(--accent-answer); /* 悬停时变成绿色，与主题一致 */
        text-decoration: underline;
    }


    </style>
</head>
<body>
    <div class="markdown-container">
        <h1 id="pageTitle">AI对话记录</h1>
        <div class="dialogue-container" id="dialogueContainer">
            <div class="loading">正在加载内容...</div>
        </div>
    </div>
    <!-- [新增] 页脚 -->
    <div class="page-footer">
        双击Alt切换选块模式&nbsp;&nbsp;|&nbsp;&nbsp;Powered by <a href="https://deepconvo.pages.dev/" target="_blank">DeepConvo</a>
    </div>
</body>
</html>
